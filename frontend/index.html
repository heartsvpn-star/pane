<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether - Control Panel</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="preloader" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#090a0d;transition:opacity .3s ease">
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px">
          <svg width="56" height="56" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="metal" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#f4f5f8"/>
                <stop offset="28%" stop-color="#c8ccd6"/>
                <stop offset="55%" stop-color="#9ea3b0"/>
                <stop offset="78%" stop-color="#d8dbe3"/>
                <stop offset="100%" stop-color="#8a8f9c"/>
              </linearGradient>
              <linearGradient id="edge" x1="8" y1="6" x2="14" y2="22" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="ring" x1="4" y1="14" x2="28" y2="20" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#aeb4c2" stop-opacity="0.35"/>
                <stop offset="40%" stop-color="#e8eaf0"/>
                <stop offset="70%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#c0c5d0" stop-opacity="0.5"/>
              </linearGradient>
            </defs>
            <circle cx="16" cy="16" r="13.5" fill="#d8dbe3" opacity="0.06"/>
            <path d="M5.2 19.8 C6.5 12.2 11.8 7.2 16.5 7.8 C21.8 8.5 26.2 14.5 25.6 21.2" stroke="url(#ring)" stroke-width="1.35" fill="none" stroke-linecap="round" opacity="0.55"/>
            <path d="M16 5.8 L24.6 26.2 H20.9 L19.05 21.1 H12.95 L11.1 26.2 H7.4 L16 5.8 Z M13.85 18.2 H18.15 L16 12.4 L13.85 18.2 Z" fill="url(#metal)"/>
            <path d="M16 5.8 L11.1 26.2 H7.4 L16 5.8 Z" fill="url(#edge)" opacity="0.55"/>
            <path d="M12.95 21.1 H19.05 L18.15 18.2 H13.85 Z" fill="#b8bcc8" opacity="0.9"/>
            <path d="M6.8 17.6 C9.5 13.8 13.2 11.4 17.4 12.1 C22.4 13 26.5 17.8 25.2 22.6" stroke="url(#ring)" stroke-width="1.55" fill="none" stroke-linecap="round"/>
            <circle cx="24.6" cy="16.8" r="1.15" fill="#ffffff"/>
            <circle cx="24.6" cy="16.8" r="2.4" fill="#ffffff" opacity="0.18"/>
          </svg>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
            <span style="color:#f0f1f5;font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:500;letter-spacing:0.22em">AETHERPANEL</span>
            <div style="width:64px;height:1px;background:linear-gradient(90deg,transparent,#a1a5b0,transparent);opacity:0.5"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
